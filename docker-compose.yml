# docker-compose.yml
version: "3.8"

services:
  redis:
    image: redis:alpine
    container_name: cab-bot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  cab-bot:
    build: .
    container_name: cab-booking-bot
    ports:
      - "8080:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - SESSION_TTL_HOURS=1
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - PORT=8000
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./service-account.json:/app/service-account.json:ro
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
